name: Deploy Demo Key Vaults

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

      suffix:
        description: "Unique suffix for KV names (3-6 lowercase alphanumeric). Must be globally unique."
        required: true
        type: string

      resource_group:
        description: "Target resource group name (will be created if it doesn't exist)"
        required: true
        type: string
        default: "rg-demo-kvs"

      location:
        description: "Azure region"
        required: false
        type: string
        default: "westeurope"

      mi_object_id:
        description: "Object ID of the Managed Identity that needs access to all KVs"
        required: true
        type: string

      backend_storage_account:
        description: "Storage account name for Terraform state (must exist)"
        required: true
        type: string

      backend_container:
        description: "Blob container for Terraform state"
        required: false
        type: string
        default: "tfstate"

      backend_resource_group:
        description: "Resource group of the backend storage account"
        required: true
        type: string

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: demo

    defaults:
      run:
        working-directory: terraform/environments/demo-kvs

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_INPUT:            false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ inputs.backend_resource_group }}" \
            -backend-config="storage_account_name=${{ inputs.backend_storage_account }}" \
            -backend-config="container_name=${{ inputs.backend_container }}" \
            -backend-config="key=demo-kvs-${{ inputs.suffix }}.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="resource_group_name=${{ inputs.resource_group }}" \
            -var="location=${{ inputs.location }}" \
            -var="suffix=${{ inputs.suffix }}" \
            -var="mi_object_id=${{ inputs.mi_object_id }}" \
            ${{ inputs.action == 'destroy' && '-destroy' || '' }} \
            -out=tfplan.out \
            -detailed-exitcode \
          || true

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          terraform apply tfplan.out

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          terraform apply tfplan.out

      - name: Show outputs
        if: inputs.action == 'apply'
        run: terraform output -json
